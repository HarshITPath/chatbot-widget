<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chatbot Widget — Test Page</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; line-height: 1.45; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .muted { color: #62686e; font-size: 13px; }
      code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }

      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
      .card { border: 1px solid #d0d7de; border-radius: 10px; padding: 14px; background: #fff; }
      @media (prefers-color-scheme: dark) { .card { background: #111418; border-color: #2d333b; } code { background:#161b22; } }

      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 12px; font-weight: 600; opacity: 0.85; }
      .field input, .field select, .field textarea { padding: 8px 10px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; color: inherit; }
      .field input[type="color"] { padding: 0; height: 36px; }
      .field textarea { resize: vertical; min-height: 52px; }
      @media (prefers-color-scheme: dark) { .field input, .field select, .field textarea { background:#0b0e12; border-color:#2d333b; } }

      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; cursor: pointer; font-weight: 600; }
      .btn.primary { background: #1976d2; color: #fff; border-color: #1976d2; }
      .btn.ghost { background: transparent; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      @media (prefers-color-scheme: dark) { .btn { background:#0b0e12; border-color:#2d333b; } .btn.primary { border-color:#1976d2; } }

      #status { margin-top: 8px; }
      #log { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; white-space: pre-wrap; background: #0b0e12; color: #e6edf3; padding: 10px; border-radius: 8px; height: 140px; overflow: auto; border: 1px solid #2d333b; }
    </style>
  </head>
  <body>
    <h1>Chatbot Widget — Local Test</h1>
    <div class="muted">1) Build: <code>npm run build:widget</code> · 2) Open this file in your browser.</div>

    <div class="card" style="margin-top:14px;">
      <div class="grid">
        <div class="field">
          <label for="apiUrl">API URL</label>
          <input id="apiUrl" type="url" placeholder="http://192.168.0.39:3000/api" />
        </div>
        <div class="field">
          <label for="primaryColor">Primary color</label>
          <input id="primaryColor" type="color" value="#1976d2" />
        </div>
        <div class="field">
          <label for="secondaryColor">Secondary color</label>
          <input id="secondaryColor" type="color" value="#dc004e" />
        </div>
        <div class="field">
          <label for="botName">Bot name</label>
          <input id="botName" type="text" value="Assistant" />
        </div>
        <div class="field">
          <label for="position">Position</label>
          <select id="position">
            <option value="bottom-right" selected>bottom-right</option>
            <option value="bottom-left">bottom-left</option>
            <option value="top-right">top-right</option>
            <option value="top-left">top-left</option>
          </select>
        </div>
        <div class="field">
          <label for="buttonSize">Button size (px)</label>
          <input id="buttonSize" type="number" min="40" max="96" value="64" />
        </div>
        <div class="field">
          <label for="zIndex">z-index</label>
          <input id="zIndex" type="number" value="1300" />
        </div>
        <div class="field">
          <label for="botAvatar">Bot avatar (emoji)</label>
          <input id="botAvatar" type="text" value="🤖" />
        </div>
        <div class="field">
          <label for="userAvatar">User avatar (emoji)</label>
          <input id="userAvatar" type="text" value="👤" />
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label for="greeting">Greeting</label>
          <textarea id="greeting">Hi! How can I help you?</textarea>
        </div>
        <div class="field" style="grid-column: 1/-1;">
          <label for="placeholder">Input placeholder</label>
          <input id="placeholder" type="text" value="Type your message..." />
        </div>
      </div>

      <div class="toolbar" style="margin-top:12px;">
        <button id="initBtn" class="btn primary" type="button" disabled>Init widget</button>
        <button id="updateBtn" class="btn" type="button" disabled>Update config</button>
        <button id="showBtn" class="btn" type="button" disabled>Show</button>
        <button id="hideBtn" class="btn" type="button" disabled>Hide</button>
        <button id="destroyBtn" class="btn ghost" type="button" disabled>Destroy</button>
        <span id="status" class="muted">Status: waiting to load script…</span>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;">
        <strong>Log</strong>
        <button id="clearLog" class="btn" type="button">Clear</button>
      </div>
      <pre id="log" aria-live="polite"></pre>
    </div>

    <!-- Load the built UMD bundle from dist -->
    <script>
      (function () {
        var script = document.createElement('script');
        script.src = './dist/widget/chatbot-widget.umd.js';
        script.async = true;
        script.onload = function () {
          document.getElementById('status').textContent = 'Widget script loaded. Click "Init widget" to start.';
          // Enable controls now that the global ChatbotWidget should be available
          ['initBtn','updateBtn','showBtn','hideBtn','destroyBtn'].forEach(function(id){
            var el = document.getElementById(id);
            if (el) el.disabled = false;
          });
        };
        script.onerror = function () {
          document.getElementById('status').textContent = 'Failed to load ./dist/widget/chatbot-widget.umd.js. Did you run "npm run build:widget"?';
        };
        document.body.appendChild(script);
      })();
    </script>

    <!-- Simple init helper -->
    <script>
      const lsKey = 'chatbot-widget-test-config';

      function logLine(msg) {
        const el = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        el.textContent += `[${time}] ${msg}\n`;
        el.scrollTop = el.scrollHeight;
      }

      function readConfigFromForm() {
        const val = (id) => document.getElementById(id).value;
        const num = (id) => Number(document.getElementById(id).value);
        return {
          apiUrl: val('apiUrl') || 'http://192.168.0.39:3000/api',
          primaryColor: val('primaryColor') || '#1976d2',
          secondaryColor: val('secondaryColor') || '#dc004e',
          botName: val('botName') || 'Assistant',
          botAvatar: val('botAvatar') || '🤖',
          userAvatar: val('userAvatar') || '👤',
          position: val('position') || 'bottom-right',
          buttonSize: num('buttonSize') || 64,
          zIndex: num('zIndex') || 1300,
          greeting: val('greeting') || 'Hi! How can I help you?',
          placeholder: val('placeholder') || 'Type your message...',
        };
      }

      function writeConfigToForm(cfg) {
        const set = (id, v) => { const el = document.getElementById(id); if (el && v !== undefined) el.value = v; };
        set('apiUrl', cfg.apiUrl);
        set('primaryColor', cfg.primaryColor);
        set('secondaryColor', cfg.secondaryColor);
        set('botName', cfg.botName);
        set('botAvatar', cfg.botAvatar);
        set('userAvatar', cfg.userAvatar);
        set('position', cfg.position);
        set('buttonSize', cfg.buttonSize);
        set('zIndex', cfg.zIndex);
        set('greeting', cfg.greeting);
        set('placeholder', cfg.placeholder);
      }

      function persist(cfg) {
        try { localStorage.setItem(lsKey, JSON.stringify(cfg)); } catch {}
      }
      function restore() {
        try { const s = localStorage.getItem(lsKey); if (s) return JSON.parse(s); } catch {}
        return null;
      }

      function setButtonsEnabled(enabled) {
        ['initBtn','updateBtn','showBtn','hideBtn','destroyBtn'].forEach(id => {
          const el = document.getElementById(id); if (el) el.disabled = !enabled;
        });
      }

      function initWidget() {
        const statusEl = document.getElementById('status');
        if (!window.ChatbotWidget || typeof window.ChatbotWidget.init !== 'function') {
          statusEl.textContent = 'ChatbotWidget not found yet. Is the script loaded?';
          return;
        }
        const cfg = readConfigFromForm();
        persist(cfg);

        try {
          window.ChatbotWidget.init(cfg);
          statusEl.textContent = 'Widget initialized.';
          logLine('Initialized with config: ' + JSON.stringify(cfg));
        } catch (e) {
          console.error(e);
          statusEl.textContent = 'Init error: ' + (e && e.message ? e.message : e);
          logLine('Init error: ' + (e && e.message ? e.message : e));
        }
      }

      function updateConfig() {
        const cfg = readConfigFromForm();
        persist(cfg);
        if (window.ChatbotWidget?.updateConfig) {
          window.ChatbotWidget.updateConfig(cfg);
          logLine('Updated config.');
        }
      }

      function showWidget() { window.ChatbotWidget?.show?.(); logLine('Show'); }
      function hideWidget() { window.ChatbotWidget?.hide?.(); logLine('Hide'); }
      function destroyWidget() { window.ChatbotWidget?.destroy?.(); logLine('Destroy'); }

      document.getElementById('initBtn').addEventListener('click', initWidget);
      document.getElementById('updateBtn').addEventListener('click', updateConfig);
      document.getElementById('showBtn').addEventListener('click', showWidget);
      document.getElementById('hideBtn').addEventListener('click', hideWidget);
      document.getElementById('destroyBtn').addEventListener('click', destroyWidget);
      document.getElementById('clearLog').addEventListener('click', () => { document.getElementById('log').textContent=''; });
      
      // Restore last-used config
      const restored = restore();
      if (restored) writeConfigToForm(restored);
    </script>
  </body>
  </html>
